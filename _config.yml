# -------------------------
# Theme + Plugins
# -------------------------
remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

markdown: kramdown
minimal_mistakes_skin: "dark"

# -------------------------
# Site Identity
# -------------------------
title: "ZenWaveCapital"
description: "AI-accelerated quantitative trading engines using long-horizon Walk-Forward Analysis, institutional-grade validation, strict risk controls, and full automation."
logo: "/logo.png"

# -------------------------
# Author Profile
# -------------------------
author:
  name: "ZenWaveCapital"
  avatar: "/logo.png"
  bio: "AI-accelerated quant research project building long-horizon, walk-forward-validated trading engines with institutional-grade structure, strict risk controls, and full automation."
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@ZenWaveCapital"
    - label: "Telegram"
      icon: "fab fa-fw fa-telegram-plane"
      url: "https://t.me/ZenWaveCapital"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/zenwavecapital"

# -------------------------
# RSS Feed
# -------------------------
